[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read-write", path = "./vectors" },
]

remappings = [
    "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.7.0/",
    "forge-std/=dependencies/forge-std-1.17.0/src/",
]

[fuzz]
runs = 256

[dependencies]
"@openzeppelin-contracts" = "5.7.0"
"forge-std" = "1.17.0"
